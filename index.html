<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hello world — shared canvas</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f6f8fa;
    color: #1f2328;
    padding: 24px;
  }
  h1 {
    margin: 0;
    font-size: 26px;
  }
  .badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #ddf4ff;
    color: #0969da;
    border: 1px solid #54aeff;
  }
  button {
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 8px;
    border: 1px solid #1f883d;
    background: #1f883d;
    color: #fff;
    cursor: pointer;
  }
  button:hover {
    background: #1a7f37;
  }
  #output {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 18px;
  }
  .row {
    margin: 0;
  }
</style>
</head>
<body>
  <h1>Hello world</h1>
  <span class="badge">shared instance · hosted</span>
  <button id="nameBtn">Name</button>
  <div id="output"></div>
  <script>
    const btn = document.getElementById("nameBtn");
    const out = document.getElementById("output");
    btn.addEventListener("click", () => {
      out.textContent = "";
      const hello = document.createElement("div");
      hello.className = "row";
      hello.textContent = "Hello Tommy!";
      const ask = document.createElement("div");
      ask.className = "row";
      ask.textContent = "What can I help you with?!";
      out.appendChild(hello);
      out.appendChild(ask);
    });
  </script>
</body>
</html>
